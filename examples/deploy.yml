name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: thisisezra/releaseflip@v0
        with:
          url: https://example.com/releaseflip.php
          token: ${{ secrets.RELEASEFLIP_TOKEN }}
          source: .
          exclude: "*.md tests/"
